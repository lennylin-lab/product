services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: product-nacos
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
      MODE: standalone
      # Nacos v3 镜像即使关闭鉴权也要求提供 AUTH_TOKEN/IDENTITY（Phase 0 验证结论）
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-product-dev}
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-512m}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      # v3 控制台运行在容器内 8080；宿主机 8080 留给 product-gateway
      - "${NACOS_CONSOLE_PORT:-8090}:8080"
    healthcheck:
      # Nacos v3：8848 上的 v1/v2 console API 已废弃（410）；readiness 在主端口（容器内 8080）的
      # /v3/console/health/readiness（Phase 1 实测）
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: product-rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Phase 6：OTLP span 导出后端（jaeger all-in-one，OTLP HTTP :4318，UI :16686）。
  # 微服务侧经 OTLP_TRACES_ENABLED=true + OTLP_TRACES_ENDPOINT 打开导出（默认关闭）；
  # 仅开发观测用，生产可替换为 otel-collector + Tempo 等（design.md §3 可观测性选型）。
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: product-jaeger
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
    ports:
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
      - "${JAEGER_UI_PORT:-16686}:16686"

  mysql:
    image: mysql:8.4
    container_name: product-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-product}
      MYSQL_USER: ${MYSQL_USER:-product}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --lower_case_table_names=1
      - --max_connections=300
    ports:
      - "${MYSQL_PORT:-33066}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./deploy/mysql/backup:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: product-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"
      - "--requirepass"
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - "--maxmemory"
      - ${REDIS_MAXMEMORY:-256mb}
      - "--maxmemory-policy"
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - "--databases"
      - ${REDIS_DATABASES:-16}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: product-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:-"-Xms1g -Xmx1g"}
    ports:
      - "${ELASTICSEARCH_PORT:-9201}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: product-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: product-logstash
    depends_on:
      - elasticsearch
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:-"-Xms512m -Xmx512m"}
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    volumes:
      - ./deploy/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.3
    container_name: product-filebeat
    user: root
    depends_on:
      - logstash
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./deploy/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${PRODUCT_LOG_PATH:-./logs}:/var/log/product:ro

volumes:
  mysql_data:
  redis_data:
  es_data:
  rabbitmq_data:

name: integration-tests

# 系统/集成级测试（compose + REST 黑盒）：手动触发 only。
# push 主流程（build.yml：270 离线单测）零改动、零依赖本文件。
on:
  workflow_dispatch:

jobs:
  it:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # compose 四件套凭据（对齐 .env.example 基线；服务 schema 默认值同源）
      MYSQL_ROOT_PASSWORD: "123456"
      REDIS_PASSWORD: "123456"
      TZ: Asia/Taipei
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build service fat-jars (skip offline tests)
        working-directory: product-services
        run: mvn -B -ntp -DskipTests package

      - name: Boot IT stack (infra + schema + 6 services, isolated ports/redis-db/rabbit-vhost/nacos-group)
        run: product-services/product-integration-tests/scripts/it-up.sh

      - name: Run integration suites (failsafe *IT)
        working-directory: product-services
        run: mvn -B -ntp -pl product-integration-tests verify

      - name: Tear down IT service instances (recorded pids only)
        if: always()
        run: product-services/product-integration-tests/scripts/it-down.sh

      - name: Archive transcripts and failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-evidence
          path: |
            product-services/product-integration-tests/target/it-transcripts/
            product-services/product-integration-tests/target/failsafe-reports/
            product-services/logs/
          if-no-files-found: warn
          retention-days: 7

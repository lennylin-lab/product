server:
  port: 8102

spring:
  application:
    name: product-master-data
  config:
    import:
      - optional:nacos:product-common.yml?group=PRODUCT_COMMON
      - optional:nacos:product-master-data.yml?group=PRODUCT_MASTER_DATA
  cloud:
    # Feign 契约超时（Phase 4：启用工艺路线删除保护的跨域确认链，demand+planning）。
    # 重试维持 OpenFeign 默认 Retryer.NEVER_RETRY；不可达时 RouteDeleteGuard fail-closed
    # （拒绝删除启用中路线，见 RouteDeleteGuard javadoc）。
    openfeign:
      client:
        config:
          demandBatchQueryClient:
            connect-timeout: 2000
            read-timeout: 3000
          planningBatchClient:
            connect-timeout: 2000
            read-timeout: 3000
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: PRODUCT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:dev}
  # 数据源：master_data_db（ADR-0005 database per service；独立最小权限账号 master_data_svc，
  # 仅 master_data_db 的 DML 权限，见 db/init/master_data_schema.sql）
  datasource:
    url: jdbc:mysql://${MASTER_DATA_DB_HOST:127.0.0.1}:${MASTER_DATA_DB_PORT:33066}/master_data_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MASTER_DATA_DB_USERNAME:master_data_svc}
    password: ${MASTER_DATA_DB_PASSWORD:master-data-dev-pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus（与单体 mybatis 配置项一致；分页 maxLimit=100/overflow=true 见 MybatisPlusConfig）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.product.masterdata.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# ---- 可观测性基线（健康检查 liveness/readiness、Prometheus 指标） ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# ---- OpenAPI 基线 ----
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 服务安全基线：本地验签（ADR-0003：直连端口必须携带有效签名 token；
# 公钥取自 identity 的 JWKS 端点）。permitAll 基线（swagger/健康检查/skeleton）内建于
# product-cloud-security，/internal/master-data 亦不豁免——契约调用方透传用户 JWT。
product:
  security:
    enabled: true
    header: Authorization
    jwks-uri: ${PRODUCT_SECURITY_JWKS_URI:http://127.0.0.1:8101/jwks}

logging:
  level:
    com.product: info

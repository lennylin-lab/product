server:
  port: 8080

spring:
  application:
    name: product-gateway
  # 网关自带 JWT 前置校验（JwtAuthGlobalFilter），排除 Boot 默认 Reactive Security
  # （否则默认链先于网关路由生效：全部请求 401、/login 被替换为自动生成登录页，ADR-0003 网关侧语义被破坏）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration
  config:
    import:
      - optional:nacos:product-common.yml?group=PRODUCT_COMMON
      - optional:nacos:product-gateway.yml?group=PRODUCT_GATEWAY
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
        group: PRODUCT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:dev}
    gateway:
      server:
        webflux:
          # CORS（对照单体 ResourcesConfig CorsFilter：originPattern */header */method *、maxAge 1800）
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedHeaders: "*"
                allowedMethods: "*"
                maxAge: 1800
          routes:
            # ---- Identity 正式路由（Phase 2）：外部 API 路径与单体保持一致（不剥离前缀）----
            # 匿名端点 /login、/captchaImage、/jwks 与受保护端点共用同一组路由，
            # 鉴权由 JWT 前置校验全局过滤器按 permitPaths 处理（ADR-0003）。
            - id: identity-auth
              uri: lb://product-identity
              predicates:
                - Path=/login,/register,/captchaImage,/jwks,/getInfo,/getRouters
            - id: identity-system
              uri: lb://product-identity
              predicates:
                - Path=/system/user/**,/system/menu/**,/system/dict/**
            # ---- Master Data 正式路由（Phase 3）：产品与工艺路线归 master-data 所有，
            # 对外路径与单体保持一致（baselines.md §1.2：/demand/product、/pps/product-route）。
            # /demand/product 必须声明在下方 /demand/** 之前（SCG 按声明顺序匹配）。 ----
            - id: master-data-product
              uri: lb://product-master-data
              predicates:
                - Path=/demand/product,/demand/product/**
            - id: master-data-product-route
              uri: lb://product-master-data
              predicates:
                - Path=/pps/product-route,/pps/product-route/**
            # ---- Planning 正式路由（Phase 4）：批次/工序任务/派工归 planning 所有，
            # 对外路径与单体保持一致（baselines.md §1.2：/pps/batch、/pps/task、/pps/assignment）。
            # 与 master-data 的 /pps/product-route 路径互不重叠。 ----
            - id: planning-batch
              uri: lb://product-planning
              predicates:
                - Path=/pps/batch,/pps/batch/**
            - id: planning-task
              uri: lb://product-planning
              predicates:
                - Path=/pps/task,/pps/task/**
            - id: planning-assignment
              uri: lb://product-planning
              predicates:
                - Path=/pps/assignment,/pps/assignment/**
            # ---- Demand 正式路由（Phase 3）：客户/订单/订单行及订单生命周期，路径不变 ----
            - id: demand-business
              uri: lb://product-demand
              predicates:
                - Path=/demand/**
            # ---- Phase 1 骨架冒烟路由（StripPrefix=1，服务本地路径以 / 开头）----
            # 未迁移服务（Phase 3-5）继续使用前缀占位路由；经网关访问同样需要有效 JWT。
            - id: identity
              uri: lb://product-identity
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1
            - id: master-data
              uri: lb://product-master-data
              predicates:
                - Path=/master-data/**
              filters:
                - StripPrefix=1
            - id: demand
              uri: lb://product-demand
              predicates:
                - Path=/demand-svc/**
              filters:
                - StripPrefix=1
            - id: planning
              uri: lb://product-planning
              predicates:
                - Path=/planning/**
              filters:
                - StripPrefix=1
            - id: execution
              uri: lb://product-execution
              predicates:
                - Path=/execution/**
              filters:
                - StripPrefix=1

# ---- 可观测性基线（健康检查 liveness/readiness、Prometheus 指标） ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  # 追踪基线：W3C 传播由 micrometer-tracing-otel 桥接默认启用；开发期全量采样，
  # 生产采样率与 OTLP 导出（collector）在统一切换前（Phase 6）接入。
  tracing:
    sampling:
      probability: 1.0

# ---- OpenAPI 聚合基线：各服务 /v3/api-docs 经路由聚合（baselines.md §1.3 显式差异） ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: identity
        url: /identity/v3/api-docs
      - name: master-data
        url: /master-data/v3/api-docs
      - name: demand
        url: /demand-svc/v3/api-docs
      - name: planning
        url: /planning/v3/api-docs
      - name: execution
        url: /execution/v3/api-docs

# ---- JWT 前置校验与 Sentinel 网关流控（ADR-0003；Phase 2） ----
product:
  skeleton:
    config-marker: local-default
    shared-marker: local-default
  gateway:
    header: Authorization
    jwks-uri: ${PRODUCT_SECURITY_JWKS_URI:http://127.0.0.1:8101/jwks}
    auth-enabled: true
    # Sentinel 网关流控：routeId -> QPS（进程级规则；Nacos 持久化随 Phase 3+）
    sentinel:
      routes:
        identity-auth: ${GATEWAY_IDENTITY_AUTH_QPS:200}
        identity-system: ${GATEWAY_IDENTITY_SYSTEM_QPS:200}

